name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm build
      - name: Check links in built site
        uses: lycheeverse/lychee-action@v2
        with:
          # Pages link to clean URLs (/about) that Cloudflare serves from about.html.
          args: --offline --no-progress --root-dir "$(pwd)/build" --fallback-extensions html 'build/**/*.html'
          fail: true
